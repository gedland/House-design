<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Husform">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Husform – fra bilder til 3D-modell</title>
<script>document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';</script>
<script>
// Viser en lesbar feilmelding i stedet for en tom side hvis 3D-visningen ikke starter.
(function () {
  var shown = false;
  window.husformFail = function (msg) {
    if (shown || window.husformReady) return; shown = true;
    var e = document.getElementById('fatal'); if (!e) return alert(msg);
    e.firstChild.textContent = msg; e.hidden = false;
  };
  addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT') husformFail('Kunne ikke laste appen eller 3D-biblioteket (Three.js fra cdn.jsdelivr.net). Sjekk nettforbindelsen og last siden på nytt.');
    else if (e.message) husformFail('3D-visningen stoppet: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
  }, true);
  addEventListener('unhandledrejection', function (e) { husformFail('3D-visningen stoppet: ' + (e.reason && e.reason.message || e.reason)); });
  setTimeout(function () { husformFail('3D-visningen startet ikke. Enten ble ikke Three.js lastet fra cdn.jsdelivr.net, eller så er nettleseren for gammel (krever iOS 16.4 eller nyere Chrome, Edge eller Firefox).'); }, 12000);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view" aria-label="3D-visning av huset"></canvas>
<header>
  <h1>Husform</h1>
  <button id="undo" type="button" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3.5 9.5 8 14M4 9.5h10a6 6 0 0 1 0 12h-3"/></svg>Angre
  </button>
</header>
<nav id="floors" aria-label="Visning"></nav>
<p id="tip">Trykk på en vegg, et gulv, et vindu eller et møbel for å endre det.</p>
<div id="banner" role="status"></div>
<div id="stick" aria-label="Gå"><i id="knob"></i></div>
<nav id="bar" aria-label="Verktøy">
  <button id="b-photos" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4Z"/><circle cx="12" cy="13" r="3.5"/></svg>Bilder</button>
  <button id="b-add" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Legg til</button>
  <button id="b-walk" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10l8-6 8 6v10M10 20v-6h4v6"/></svg>Gå inn</button>
  <button id="b-more" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>Mer</button>
</nav>
<aside id="panel" aria-label="Panel"></aside>
<div id="fatal" role="alert" hidden><p></p><button type="button" onclick="location.reload()">Last på nytt</button></div>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // Når en ny versjon tar over, lastes siden én gang på nytt så alle filene kommer fra samme versjon.
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !sessionStorage.swReload) { sessionStorage.swReload = 1; location.reload(); } });
  navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
}
</script>
</body>
</html>
